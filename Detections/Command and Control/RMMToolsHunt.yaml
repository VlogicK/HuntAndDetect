id: 70c70e2c-aba2-525c-9a9e-ee2820a475cf

displayName: RMM Tools Hunting

description: |
  Detects usage of known Remote Monitoring and Management (RMM) tool executables
  or network connections to known RMM domains. These tools are commonly used in
  legitimate IT operations but are also frequently abused by threat actors for
  remote access and persistence in enterprise environments.

kind: Scheduled
severity: Medium
enabled: true

author: VaasudevKala

query: |
  let RMMIOCs=externaldata (ToolName:string,
    ExecutableName:string,
    ProcessName:string,
    Domain:string)["https://raw.githubusercontent.com/VlogicK/HuntAndDetect/main/Detections/Command%20and%20Control/Enhanced_RMM_Tools_List_With_Domains.csv"]
    with (format="csv", ignoreFirstRecord=true);
  let RMMProcNames=RMMIOCs
  | distinct ProcessName;
  let RMMDomains=RMMIOCs
  | distinct Domain;
  let procesEventsQuery=DeviceProcessEvents
  | where FileName has_any (RMMProcNames)
  | extend eventtype="ProcessEvent";
  let networkEventsQuery=DeviceNetworkEvents
  | where RemoteUrl has_any (RMMDomains)
  | extend eventtype="NetworkEvent";
  union procesEventsQuery, networkEventsQuery

queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: GreaterThan
triggerThreshold: 0

suppressionDuration: PT5H
suppressionEnabled: false

tactics:
  - CommandAndControl
  - DefenseEvasion

techniques:
  - T1219
  - T1105

subTechniques: []

incidentConfiguration:
  createIncident: true

eventGroupingSettings:
  aggregationKind: AlertPerResult

entityMappings: []
