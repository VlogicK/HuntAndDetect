id: 082c4eef-9ad3-5cb6-8968-2a330384a581

displayName: Shimcache Flush Activity

description: |
  Detects attempts to flush Shimcache, which may indicate anti-forensic activity.
  Adversaries may use this technique to erase evidence of executed files and
  hinder post-compromise analysis.
  Ref: https://blueteamops.medium.com/shimcache-flush-89daff28d15e

kind: Scheduled
severity: Medium
enabled: true

author: VaasudevKala

query: |
  DeviceProcessEvents
  | where FileName has "Rundll32.exe"
  | where ((ProcessCommandLine has_any("ShimFlushCache","BaseFlushAppcompatCache"))
      or (ProcessCommandLine has_any (@"#250",@"#46") and ProcessCommandLine has_any ("apphelp.dll","kernel32.dll"))) // checking for ordinals as well

queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: GreaterThan
triggerThreshold: 0

suppressionDuration: PT5H
suppressionEnabled: false

tactics:
  - DefenseEvasion

techniques:
  - T1112

subTechniques: []

incidentConfiguration:
  createIncident: true

eventGroupingSettings:
  aggregationKind: AlertPerResult

entityMappings: []
