id: 84535502-de95-5003-94c2-fb5d29aa25f1

displayName: Colorcpl Abuse for Defense Evasion

description: |
  Detects use of the legitimate Windows colorcpl.exe utility with bitsadmin.exe.
  Guildma (Astaroth) malware has been observed abusing colorcpl.exe to copy
  bitsadmin.exe into a less-scrutinized directory before using it to retrieve
  additional payloads.
  Ref: https://lolbas-project.github.io/lolbas/Binaries/Colorcpl/
       https://isc.sans.edu/diary/29814

kind: Scheduled
severity: Medium
enabled: true

author: VaasudevKala

query: |
  DeviceProcessEvents
  | where FileName =~ "colorcpl.exe"
  | where ProcessCommandLine has "bitsadmin.exe"

queryFrequency: PT1H
queryPeriod: PT1H
triggerOperator: GreaterThan
triggerThreshold: 0

suppressionDuration: PT5H
suppressionEnabled: false

tactics:
  - DefenseEvasion

techniques:
  - T1036

subTechniques: []

incidentConfiguration:
  createIncident: true

eventGroupingSettings:
  aggregationKind: AlertPerResult

entityMappings: []
