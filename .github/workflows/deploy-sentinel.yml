name: Deploy Sentinel detections

on:
  push:
    branches:
      - main
    paths:
      - "Detections/**/*.yaml"
      - "Detections/**/*.yml"
      - "tools/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Validate detection YAML
        run: python tools/validate.py

      - name: Build Sentinel rule artifacts
        run: python tools/convert.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Sentinel rule artifacts
        run: python tools/convert.py

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Sentinel analytics rules
        run: >-
          python tools/deploy.py
          --subscription-id "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --workspace "${{ vars.SENTINEL_WORKSPACE }}"
          --apply
